[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["Iago Boardman Padilha"]
repository = "https://github.com/iagopadilha/rolo-loop"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
fancy-regex = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tempfile = "3"
proptest = "1"
insta = { version = "1", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# AppError carries the whole error body of the API on purpose; the signatures mirror the reference design.
result_large_err = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
# Style lints that would reshape code written to mirror the reference line by line (the differential tests are the safety net).
needless_range_loop = "allow"
if_same_then_else = "allow"
manual_strip = "allow"
unnecessary_to_owned = "allow"
bool_assert_comparison = "allow"
doc_overindented_list_items = "allow"
items_after_test_module = "allow"
result_unit_err = "allow"
unnecessary_sort_by = "allow"
cloned_ref_to_slice_refs = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
