name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  supply-chain:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  forbidden-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for forbidden terms (list lives in a repository secret)
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          if [ -z "$FORBIDDEN_TERMS" ]; then echo "FORBIDDEN_TERMS secret not set"; exit 2; fi
          printf '%s\n' "$FORBIDDEN_TERMS" > "$RUNNER_TEMP/terms.txt"
          if git grep -I -n -i -f "$RUNNER_TEMP/terms.txt" -- . >/dev/null; then echo "forbidden term found in tree"; exit 1; fi
          if git log --all -p | grep -i -q -f "$RUNNER_TEMP/terms.txt"; then echo "forbidden term found in history"; exit 1; fi

  spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every Rust file carries an SPDX header
        run: |
          missing=$(grep -L "SPDX-License-Identifier: MIT" $(git ls-files '*.rs') || true)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conventional Commits
        run: |
          bad=$(git log --format=%s origin/${{ github.base_ref }}..HEAD | grep -Ev '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
