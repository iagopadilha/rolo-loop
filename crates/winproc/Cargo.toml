[package]
name = "winproc"
description = "The only place with unsafe code: process queries (start time, liveness) through the Windows API"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_Security_Cryptography"] }

[lints.rust]
unsafe_code = "allow"
