[package]
publish = false
name = "engine-state"
description = "Typed state of the orchestrator graph: ROADMAP grammar, legal transitions, scheduler, snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
pycompat = { path = "../pycompat" }
cfg = { path = "../cfg" }
guard-core = { path = "../guard-core" }
serde_json = { workspace = true }
winproc = { path = "../winproc" }
egress-policy = { path = "../egress-policy" }
mcp-policy = { path = "../mcp-policy" }
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
tempfile = { workspace = true }
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
