[package]
name = "desktop"
description = "Agent Maestro desktop app: a Tauri window over the panel server it runs in-process"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "agent-maestro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
app = { path = "../app" }
cfg = { path = "../cfg" }
engine-state = { path = "../engine-state" }
pycompat = { path = "../pycompat" }
serde_json = { workspace = true }
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
